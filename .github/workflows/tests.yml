name: Pruebas de seguridad

# Corre la suite de pruebas (pytest + moto) en cada push y pull request para
# evitar regresiones en las lambdas de seguridad antes de hacer merge.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruebas-seguridad:
    name: pytest (lambdas de seguridad)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 08_Pruebas/PruebasSeguridad

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 08_Pruebas/PruebasSeguridad/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -v

  pruebas-frontend:
    name: vitest (constructor de correos)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 05_Frontend/Front/page

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          # ⚠️ NO bajar de 22: con Node 20 vitest ni siquiera arranca ("Test Files: no
          # tests" + `TypeError: webidl.util.markAsUncloneable is not a function` al cargar
          # jsdom). No es un fallo de las pruebas — son las dependencias, que piden más:
          # `undici` >=22.19.0 y `jsdom` 30 ^22.22.2. El repo llevaba varios merges con
          # el CI del frontend en rojo por esto.
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_Frontend/Front/page/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # El saneamiento del constructor decide qué HTML viaja en el correo de un cliente:
      # una regresión ahí es un XSS en la bandeja del destinatario.
      - name: Ejecutar pruebas
        run: npm test

      # Atrapa regresiones de TypeScript antes del merge (el frontend se despliega a mano).
      - name: Compilar
        run: npm run build
