<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MailConnect · Correo masivo y SMS en Colombia</title>
    <meta
      name="description"
      content="Envía campañas de email marketing y SMS desde una sola plataforma. Plantillas, combinación de correspondencia y métricas en tiempo real sobre AWS."
    />
    <link rel="canonical" href="https://www.mailconnect.com.co/" />

    <!-- Iconos de marca. El .ico lleva 16/32/48 px dentro (navegadores viejos y lectores
         de feeds lo piden así); el apple-touch-icon es el que usa iOS al guardar el sitio
         en la pantalla de inicio. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1426" />

    <!-- Open Graph: lo que se ve al compartir el enlace en WhatsApp, LinkedIn o Slack.
         ⚠️ og:image DEBE ser una URL ABSOLUTA — las relativas no las resuelve ningún
         scraper. 1200x630 es la proporción que respetan todas las plataformas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MailConnect" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://www.mailconnect.com.co/" />
    <meta property="og:title" content="MailConnect · Correo masivo y SMS en Colombia" />
    <meta
      property="og:description"
      content="Email marketing y SMS desde una sola plataforma, sobre infraestructura AWS. Paga solo por lo que envías."
    />
    <meta property="og:image" content="https://www.mailconnect.com.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MailConnect · correo masivo que sí llega a la bandeja de entrada" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MailConnect · Correo masivo y SMS en Colombia" />
    <meta
      name="twitter:description"
      content="Email marketing y SMS desde una sola plataforma, sobre infraestructura AWS. Paga solo por lo que envías."
    />
    <meta name="twitter:image" content="https://www.mailconnect.com.co/og-image.png" />

    <!-- Datos estructurados. Van AQUÍ, en el HTML que sirve el host, y no inyectados por
         React: los rastreadores que no ejecutan JavaScript —y casi todos los
         previsualizadores de enlaces— solo leen esto. Por la misma razón las meta de
         arriba son estáticas. Esta es una SPA de Vite y la landing es la única página
         pública de conversión, así que NO hace falta una librería de head management; si
         algún día se indexan más páginas con meta propias, ahí sí valdría
         `react-helmet-async` (o prerenderizar), no antes. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.mailconnect.com.co/#organizacion",
            "name": "MailConnect S.A.S.",
            "alternateName": "MailConnect",
            "url": "https://www.mailconnect.com.co/",
            "logo": "https://www.mailconnect.com.co/icon-512.png",
            "image": "https://www.mailconnect.com.co/og-image.png",
            "description": "Plataforma colombiana de correo masivo: email marketing y SMS sobre infraestructura AWS.",
            "areaServed": { "@type": "Country", "name": "Colombia" },
            "address": { "@type": "PostalAddress", "addressCountry": "CO" },
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "sales",
                "telephone": "+57-320-458-6576",
                "availableLanguage": ["Spanish"],
                "areaServed": "CO"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.mailconnect.com.co/#sitio",
            "url": "https://www.mailconnect.com.co/",
            "name": "MailConnect",
            "inLanguage": "es-CO",
            "publisher": { "@id": "https://www.mailconnect.com.co/#organizacion" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "MailConnect",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://www.mailconnect.com.co/",
            "inLanguage": "es-CO",
            "publisher": { "@id": "https://www.mailconnect.com.co/#organizacion" },
            "featureList": [
              "Campañas de email marketing con plantillas HTML",
              "SMS masivo",
              "Combinación de correspondencia con adjuntos personalizados",
              "Reportes de entrega, apertura y clics en tiempo real"
            ],
            "offers": {
              "@type": "Offer",
              "priceCurrency": "COP",
              "description": "Saldo prepago: se paga por mensaje enviado, con precio por volumen. Sin mensualidad ni permanencia."
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://www.mailconnect.com.co/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Qué necesito para empezar a enviar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tres cosas: una cuenta, tu base de contactos y una plantilla. Creas la cuenta, subes la base en CSV, Excel o JSON, diseñas el mensaje con el editor y recargas saldo. No hay instalación ni configuración de servidores."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo enviar desde mi propio dominio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Registras tu dominio (o un correo específico) en la plataforma y te entregamos los registros DNS a publicar. Cuando quedan verificados, tus campañas salen desde tu dominio con la firma DKIM correspondiente. El panel te muestra el estado de DKIM, SPF y DMARC para que sepas si tu correo está autenticando bien, sin depender de herramientas externas."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cómo se cobra? ¿Hay mensualidad?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No hay mensualidad ni permanencia. El modelo es prepago: recargas saldo y se descuenta por envío. El precio por mensaje baja con el volumen mensual. Antes de confirmar cada campaña la plataforma te muestra el costo estimado con su desglose, así que nunca envías sin saber cuánto cuesta."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué formato debe tener mi base de datos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Aceptamos CSV, Excel (.xlsx) y JSON. Las tres primeras columnas son fijas: identificación, contacto (correo o celular según el canal) y nombre; de ahí en adelante agregas las columnas que quieras usar como variables en la plantilla. Al subirla se valida sola: te dice cuántos contactos son válidos, cuántos están repetidos y cuáles tienen el formato mal, antes de que gastes un solo envío."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo probar antes de enviar a toda la base?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí, y es el flujo recomendado. Cada campaña permite enviar muestras a los correos o celulares que indiques —con los datos reales de tu base— y solo después de aprobarla se habilita el envío masivo. Las muestras no cuentan en tus reportes ni en tu consumo."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué pasa con los rebotes y las bajas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Se gestionan solos. Todo correo lleva su enlace de baja, y quien se da de baja o rebota de forma permanente entra a tu lista negra automáticamente: la plataforma lo excluye de los envíos siguientes sin que tengas que hacer nada. También puedes agregar o quitar contactos de esa lista a mano."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cumple con la Ley 1581 (habeas data)?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "La plataforma trae las piezas que exige la norma: enlace de baja en cada mensaje, centro de preferencias para el destinatario, registro de la aceptación de términos y lista de exclusión por cliente. La autorización de tratamiento de datos de tus contactos sigue siendo responsabilidad tuya como responsable de la base."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo generar un documento distinto para cada destinatario?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí: es la combinación de correspondencia. A partir de una plantilla y tu base generamos un documento único por persona —certificado, factura, extracto, carta— y lo enviamos como adjunto o como enlace de descarga. Sirve para volúmenes de miles de documentos, que es donde hacerlo a mano deja de ser viable."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué reportes tengo después de enviar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Enviados, entregados, aperturas, clics, rebotes y quejas, por campaña y en una serie de los últimos 30 días. Puedes exportar el detalle a CSV para cruzarlo con tus propios sistemas."
                }
              },
              {
                "@type": "Question",
                "name": "¿Ofrecen WhatsApp y llamadas de voz?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Todavía no. Hoy la plataforma envía por correo y SMS. WhatsApp y voz están en camino, pero preferimos no ofrecerlos hasta poder prestarlos bien."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
